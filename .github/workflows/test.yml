name: test

on:
  push:
  pull_request:

jobs:
  # 规则回归：不需要任何依赖，跑得最快，红了先看这个
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 每个 fixture 都是故意写错的配置，断言精确的规则集合（多报/漏报都算失败）
      - name: 坏样本回归
        run: python tests/run_tests.py

  # 服务本身：装 mcp，把 MCP 服务真的启起来跑一遍协议
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 mcp SDK
        run: python -m pip install --only-binary :all: mcp

      # 直接调用四个工具（没有 game-lib.jar / 反编译产物时会自动 SKIP 对应项）
      - name: 工具自检
        run: python tools/rw_mcp/selftest.py

      # 真的把服务当 MCP 服务启动，走 initialize / tools/list / tools/call
      - name: MCP 协议测试
        run: python tools/rw_mcp/selftest.py --stdio

      # 启动器至少要能在干净环境里跑起来
      - name: 启动器环境检查
        run: python bootstrap.py --check
