[core]
name: t_reset_elsewhere
displayText: Reset Elsewhere
displayText_zh: 别处复位
@memory i: float

[hiddenAction_other]
autoTriggerOnEvent: created
setUnitMemory: i= 0

[hiddenAction_start]
autoTriggerOnEvent: tookDamage
alsoTriggerAction: step
alsoTriggerActionRepeat: 4

[hiddenAction_step]
setUnitMemory: i= memory.i + 1
