[core]
name: t_update_mem
displayText: Update Mem
displayText_zh: 用 updateUnitMemory 写
@memory i: float
@memory buf: float[]

[hiddenAction_start]
autoTriggerOnEvent: created
updateUnitMemory: i= 0
alsoTriggerAction: step
alsoTriggerActionRepeat: 4

[hiddenAction_step]
updateUnitMemory: """
buf[memory.i]= memory.i,
i= memory.i + 1
"""
