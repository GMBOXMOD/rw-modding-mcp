[core]
name: t_loop_no_advance
displayText: Loop No Advance
displayText_zh: 循环不推进
@memory i: float

[hiddenAction_start]
autoTriggerOnEvent: created
setUnitMemory: i= 0
alsoTriggerAction: step
alsoTriggerActionRepeat: 4

[hiddenAction_step]
alsoTriggerOrQueueActionConditional: if memory.i == 4
alsoTriggerAction: done
setUnitMemory: i= 0

[hiddenAction_done]
setUnitMemory: i= 1
