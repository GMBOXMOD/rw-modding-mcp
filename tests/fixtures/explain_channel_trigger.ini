[core]
name: t_channel_trigger
displayText: Channel Trigger
displayText_zh: 通道触发

[hiddenAction_sweep]
autoTrigger: true
takeResources_searchOnly: true
takeResources_includeUnitsWithinRange: 100
takeResources_includeUnitsWithinRange_team: enemy
takeResources_triggerActionIfAnyCollected: alarm
takeResources_triggerActionIfNoneCollected: idle

[hiddenAction_alarm]
showMessageToAllPlayers: contact

[hiddenAction_idle]
showMessageToAllPlayers: quiet

[turret_1]
x: 0
y: 0
projectile: 1
onShoot_triggerActions: heatUp

[hiddenAction_heatUp]
setUnitMemory: heat = memory.heat + 1

